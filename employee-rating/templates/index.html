<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оценка сотрудников</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #2563eb;
            --accent-hover: #1d4ed8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --star-inactive: #475569;
            --star-active: #f59e0b;
            --error-color: #ef4444;
            --success-color: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 28px 24px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 14px;
            color: var(--text-muted);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
        }

        input[type="text"], textarea {
            width: 100%;
            padding: 12px 14px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s ease;
        }

        input[type="text"]:focus, textarea:focus {
            border-color: var(--accent-color);
        }

        textarea {
            resize: vertical;
            min-height: 90px;
        }

        .stars-container {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 6px;
        }

        .star {
            font-size: 32px;
            color: var(--star-inactive);
            cursor: pointer;
            transition: color 0.15s ease, transform 0.15s ease;
            user-select: none;
        }

        .star:hover, .star.active {
            color: var(--star-active);
        }

        .star:active {
            transform: scale(1.2);
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background-color: var(--accent-color);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease, opacity 0.2s ease;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: var(--accent-hover);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .alert {
            display: none;
            padding: 16px;
            border-radius: 8px;
            margin-top: 20px;
            text-align: center;
            font-size: 15px;
            font-weight: 500;
            line-height: 1.4;
        }

        .alert-success {
            background-color: rgba(16, 185, 129, 0.15);
            border: 1px solid var(--success-color);
            color: var(--success-color);
        }

        .alert-error {
            background-color: rgba(239, 68, 68, 0.15);
            border: 1px solid var(--error-color);
            color: var(--error-color);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Оценка сотрудников</h1>
        <p>Пожалуйста, оцените качество обслуживания</p>
    </div>

    <form id="ratingForm">
        <div class="form-group">
            <label for="checkpoint">Пункт пропуска *</label>
            <input type="text" id="checkpoint" placeholder="КПП №1" required>
        </div>

        <div class="form-group">
            <label for="employee_name">ФИО сотрудника *</label>
            <input type="text" id="employee_name" placeholder="Иванов И.И." required>
        </div>

        <div class="form-group">
            <label>Ваша оценка *</label>
            <div class="stars-container" id="starsContainer">
                <span class="star" data-value="1">&#9733;</span>
                <span class="star" data-value="2">&#9733;</span>
                <span class="star" data-value="3">&#9733;</span>
                <span class="star" data-value="4">&#9733;</span>
                <span class="star" data-value="5">&#9733;</span>
            </div>
        </div>

        <div class="form-group">
            <label for="comment">Текст отзыва / комментарий</label>
            <textarea id="comment" placeholder="Опишите подробности (необязательно)"></textarea>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">Отправить оценку</button>
    </form>

    <div id="alertSuccess" class="alert alert-success"></div>
    <div id="alertError" class="alert alert-error"></div>
</div>

<script>
    let currentRating = 0;
    const stars = document.querySelectorAll('.star');
    const form = document.getElementById('ratingForm');
    const submitBtn = document.getElementById('submitBtn');
    const alertSuccess = document.getElementById('alertSuccess');
    const alertError = document.getElementById('alertError');

    stars.forEach(star => {
        star.addEventListener('mouseover', function() {
            highlightStars(this.getAttribute('data-value'));
        });

        star.addEventListener('mouseout', function() {
            highlightStars(currentRating);
        });

        star.addEventListener('click', function() {
            currentRating = this.getAttribute('data-value');
            highlightStars(currentRating);
        });
    });

    function highlightStars(val) {
        stars.forEach(star => {
            if (star.getAttribute('data-value') <= val) {
                star.classList.add('active');
            } else {
                star.classList.remove('active');
            }
        });
    }

    form.addEventListener('submit', async function(e) {
        e.preventDefault();

        alertSuccess.style.display = 'none';
        alertError.style.display = 'none';

        if (currentRating === 0) {
            showError('Пожалуйста, выберите количество звёзд!');
            return;
        }

        submitBtn.disabled = true;
        submitBtn.innerText = 'Отправка...';

        try {
            const response = await fetch('/api/rate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    checkpoint: document.getElementById('checkpoint').value.trim(),
                    employee_name: document.getElementById('employee_name').value.trim(),
                    rating: currentRating,
                    comment: document.getElementById('comment').value.trim()
                })
            });

            const result = await response.json();

            if (response.ok && result.success) {
                form.style.display = 'none';
                alertSuccess.innerText = result.message;
                alertSuccess.style.display = 'block';
            } else {
                showError(result.message || 'Ошибка отправки.');
                submitBtn.disabled = false;
                submitBtn.innerText = 'Отправить оценку';
            }
        } catch (err) {
            showError('Ошибка сети или сервера. Проверьте интернет.');
            submitBtn.disabled = false;
            submitBtn.innerText = 'Отправить оценку';
        }
    });

    function showError(msg) {
        alertError.innerText = msg;
        alertError.style.display = 'block';
    }
</script>

</body>
</html>
