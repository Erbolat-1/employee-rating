<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оценка работы сотрудника</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f4f6f8; color: #333; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: #ffffff; padding: 30px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); width: 100%; max-width: 480px; }
        h2 { text-align: center; margin-bottom: 20px; color: #1a252f; font-size: 22px; }
        .form-group { margin-bottom: 18px; }
        label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 14px; color: #4a5568; }
        input, textarea, select { width: 100%; padding: 12px; border: 1px solid #cbd5e0; border-radius: 8px; font-size: 15px; outline: none; transition: border 0.2s; }
        input:focus, textarea:focus, select:focus { border-color: #3182ce; }
        textarea { resize: vertical; min-height: 100px; }
        button { width: 100%; background: #3182ce; color: white; border: none; padding: 14px; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #2b6cb0; }
        button:disabled { background: #a0aec0; cursor: not-allowed; }
        .alert { display: none; padding: 12px; border-radius: 8px; margin-top: 15px; text-align: center; font-size: 14px; }
        .alert-success { background: #c6f6d5; color: #22543d; }
        .alert-error { background: #fed7d7; color: #742a2a; }
    </style>
</head>
<body>

<div class="card">
    <h2>Оценка сотрудника</h2>
    
    <div id="formBlock">
        <form id="ratingForm">
            <div class="form-group">
                <label for="checkpoint">Пункт пропуска / Отдел:</label>
                <input type="text" id="checkpoint" placeholder="Например: КПП-1" required>
            </div>

            <div class="form-group">
                <label for="employee_name">ФИО Сотрудника:</label>
                <input type="text" id="employee_name" placeholder="Например: Иванов И.И." required>
            </div>

            <div class="form-group">
                <label for="comment">Ваш отзыв:</label>
                <textarea id="comment" placeholder="Опишите ваши впечатления о качестве обслуживания..." required></textarea>
            </div>

            <button type="submit" id="submitBtn">Отправить отзыв</button>
        </form>
    </div>

    <div id="alertSuccess" class="alert alert-success">
        ✅ Спасибо! Ваш отзыв успешно зарегистрирован.
    </div>
    <div id="alertError" class="alert alert-error"></div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const tg = window.Telegram?.WebApp;
        if (tg) tg.expand();

        const ratingForm = document.getElementById('ratingForm');
        const alertSuccess = document.getElementById('alertSuccess');
        const alertError = document.getElementById('alertError');
        const submitBtn = document.getElementById('submitBtn');

        ratingForm.addEventListener('submit', function (e) {
            e.preventDefault();

            alertError.style.display = 'none';
            alertSuccess.style.display = 'none';

            const payload = {
                checkpoint: document.getElementById('checkpoint').value.trim(),
                employee_name: document.getElementById('employee_name').value.trim(),
                comment: document.getElementById('comment').value.trim()
            };

            submitBtn.disabled = true;
            submitBtn.textContent = 'Отправка...';

            fetch('/api/rate', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error('Ошибка сервера (код ' + response.status + ')');
                }
                return response.json();
            })
            .then(data => {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Отправить отзыв';

                if (data.success) {
                    document.getElementById('formBlock').style.display = 'none';
                    alertSuccess.style.display = 'block';
                    setTimeout(() => {
                        if (tg) tg.close();
                    }, 2500);
                } else {
                    alertError.textContent = data.message || 'Произошла ошибка при отправке.';
                    alertError.style.display = 'block';
                }
            })
            .catch(err => {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Отправить отзыв';
                console.error('Ошибка:', err);
                alertError.textContent = 'Не удалось отправить данные. Проверьте соединение.';
                alertError.style.display = 'block';
            });
        });
    });
</script>

</body>
</html>
