<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оценка сотрудников по тексту</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #2563eb;
            --accent-hover: #1d4ed8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --star-color: #f59e0b;
            --error-color: #ef4444;
            --success-color: #10b981;
            --chip-bg: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 28px 24px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 14px;
            color: var(--text-muted);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
        }

        input[type="text"], textarea {
            width: 100%;
            padding: 12px 14px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s ease;
        }

        input[type="text"]:focus, textarea:focus {
            border-color: var(--accent-color);
        }

        textarea {
            resize: vertical;
            min-height: 110px;
        }

        /* Быстрые шаблоны примеров */
        .examples-title {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .presets-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 12px;
        }

        .preset-btn {
            background-color: var(--chip-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 13px;
            text-align: left;
            cursor: pointer;
            transition: background 0.2s ease, border-color 0.2s ease;
        }

        .preset-btn:hover {
            background-color: #475569;
            border-color: var(--accent-color);
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background-color: var(--accent-color);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .btn-submit:hover {
            background-color: var(--accent-hover);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .result-box {
            display: none;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
            background-color: rgba(16, 185, 129, 0.1);
            border: 1px solid var(--success-color);
            text-align: center;
        }

        .result-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--success-color);
            margin-bottom: 12px;
        }

        .result-stars {
            font-size: 28px;
            color: var(--star-color);
            margin-bottom: 8px;
        }

        .result-info {
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.5;
        }

        .alert-error {
            display: none;
            padding: 14px;
            border-radius: 8px;
            margin-top: 15px;
            background-color: rgba(239, 68, 68, 0.15);
            border: 1px solid var(--error-color);
            color: var(--error-color);
            font-size: 14px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Оценка сотрудников по тексту</h1>
        <p>Выберите готовый пример или напишите свой отзыв вручную</p>
    </div>

    <form id="ratingForm">
        <div class="form-group">
            <label for="checkpoint">Пункт пропуска *</label>
            <input type="text" id="checkpoint" placeholder="КПП №1" required>
        </div>

        <div class="form-group">
            <label for="employee_name">ФИО сотрудника *</label>
            <input type="text" id="employee_name" placeholder="Иванов И.И." required>
        </div>

        <div class="form-group">
            <label>Примеры отзывов (кликните для подстановки):</label>
            <div class="presets-list">
                <button type="button" class="preset-btn" onclick="setPreset('Сотрудник работал отлично, вежливо и очень быстро. Большое спасибо!')">
                    🟢 <b>Положительный:</b> «Отлично, вежливо и очень быстро...»
                </button>
                <button type="button" class="preset-btn" onclick="setPreset('Проверка прошла корректно и аккуратно. Замечаний нет.')">
                    🟡 <b>Нейтральный:</b> «Проверка прошла корректно, замечаний нет.»
                </button>
                <button type="button" class="preset-btn" onclick="setPreset('Сотрудник работал очень медленно, допустил ошибку и общался грубо.')">
                    🔴 <b>Отрицательный:</b> «Работал медленно, ошибка и грубость...»
                </button>
            </div>
        </div>

        <div class="form-group">
            <label for="comment">Текст отзыва для отправки *</label>
            <textarea id="comment" placeholder="Выберите пример выше или введите текст вручную..." required></textarea>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">Отправить и проанализировать</button>
    </form>

    <div id="alertError" class="alert-error"></div>

    <div id="resultBox" class="result-box">
        <div class="result-title" id="resultMessage"></div>
        <div class="result-stars" id="resultStars"></div>
        <div class="result-info" id="resultDetails"></div>
    </div>
</div>

<script>
    const form = document.getElementById('ratingForm');
    const submitBtn = document.getElementById('submitBtn');
    const alertError = document.getElementById('alertError');
    const resultBox = document.getElementById('resultBox');
    const commentInput = document.getElementById('comment');

    // Функция быстрых ответов/примеров
    function setPreset(text) {
        commentInput.value = text;
        commentInput.focus();
    }

    form.addEventListener('submit', async function(e) {
        e.preventDefault();

        alertError.style.display = 'none';
        resultBox.style.display = 'none';

        const checkpoint = document.getElementById('checkpoint').value.trim();
        const employeeName = document.getElementById('employee_name').value.trim();
        const comment = commentInput.value.trim();

        if (!checkpoint || !employeeName || !comment) {
            showError('Заполните все поля!');
            return;
        }

        submitBtn.disabled = true;
        submitBtn.innerText = 'Анализ и отправка...';

        try {
            const response = await fetch('/api/rate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    checkpoint: checkpoint,
                    employee_name: employeeName,
                    comment: comment
                })
            });

            const result = await response.json();

            if (response.ok && result.success) {
                form.style.display = 'none';
                
                document.getElementById('resultMessage').innerText = result.message;
                document.getElementById('resultStars').innerText = '★'.repeat(result.rating) + '☆'.repeat(5 - result.rating);
                document.getElementById('resultDetails').innerHTML = `
                    Автоматическая оценка: <b>${result.rating} из 5</b><br>
                    Тональность: <b>${result.sentiment}</b><br>
                    Количество слов: <b>${result.word_count}</b>
                `;
                
                resultBox.style.display = 'block';
            } else {
                showError(result.message || 'Ошибка обработки.');
                submitBtn.disabled = false;
                submitBtn.innerText = 'Отправить и проанализировать';
            }
        } catch (err) {
            showError('Ошибка связи с сервером.');
            submitBtn.disabled = false;
            submitBtn.innerText = 'Отправить и проанализировать';
        }
    });

    function showError(msg) {
        alertError.innerText = msg;
        alertError.style.display = 'block';
    }
</script>

</body>
</html>
