<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Оценка сотрудника</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #03152d,
                    #0865c5
                );

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 520px;

            background: #ffffff;

            border-radius: 24px;

            padding: 30px;

            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.35);
        }

        .logo {
            width: 75px;
            height: 75px;

            margin: 0 auto 15px;

            border-radius: 50%;

            background: #0865c5;

            color: white;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 35px;
        }

        h1 {
            text-align: center;

            color: #073b75;

            margin: 0;
        }

        .subtitle {
            text-align: center;

            color: #777;

            margin: 8px 0 25px;
        }

        label {
            display: block;

            font-weight: bold;

            margin-top: 18px;
            margin-bottom: 7px;

            color: #333;
        }

        input,
        textarea {
            width: 100%;

            padding: 14px;

            border: 1px solid #ccc;

            border-radius: 12px;

            font-size: 16px;

            outline: none;

            font-family: Arial, sans-serif;
        }

        input:focus,
        textarea:focus {
            border-color: #0865c5;

            box-shadow:
                0 0 0 3px rgba(8, 101, 197, 0.1);
        }

        textarea {
            min-height: 110px;

            resize: vertical;
        }

        /* =========================
           ЗВЁЗДЫ
        ========================= */

        .stars {
            display: flex;

            flex-direction: row-reverse;

            justify-content: center;

            gap: 5px;

            margin: 10px 0 20px;
        }

        .stars input {
            display: none;
        }

        .stars label {
            margin: 0;

            font-size: 45px;

            color: #ccc;

            cursor: pointer;

            transition: 0.2s;
        }

        .stars label:hover,
        .stars label:hover ~ label,
        .stars input:checked ~ label {
            color: #ffc107;
        }

        /* =========================
           КНОПКА
        ========================= */

        button {
            width: 100%;

            border: none;

            border-radius: 12px;

            background: #0865c5;

            color: white;

            padding: 16px;

            margin-top: 20px;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }

        button:hover {
            background: #064d98;
        }

        button:disabled {
            background: #8aaed2;

            cursor: wait;
        }

        /* =========================
           УСПЕХ
        ========================= */

        .success {
            display: none;

            text-align: center;

            padding: 20px;
        }

        .success-icon {
            font-size: 65px;
        }

        .success h2 {
            color: #16833b;
        }

        /* =========================
           ОШИБКА
        ========================= */

        .error {
            display: none;

            background: #ffe5e5;

            color: #b00020;

            border-radius: 10px;

            padding: 12px;

            margin-top: 15px;

            text-align: center;

            font-size: 14px;
        }

        /* =========================
           FOOTER
        ========================= */

        .footer {
            text-align: center;

            color: #999;

            font-size: 12px;

            margin-top: 18px;
        }

        /* =========================
           АДАПТИВ
        ========================= */

        @media (max-width: 600px) {

            body {
                padding: 10px;
            }

            .card {
                padding: 22px;

                border-radius: 18px;
            }

            .logo {
                width: 65px;
                height: 65px;

                font-size: 30px;
            }

            h1 {
                font-size: 25px;
            }

            .stars label {
                font-size: 40px;
            }
        }
    </style>
</head>


<body>

<div class="card">

    <!-- =========================
         ФОРМА
    ========================== -->

    <div id="formBlock">

        <div class="logo">
            ★
        </div>

        <h1>
            Оценка сотрудника
        </h1>

        <div class="subtitle">
            Оцените качество обслуживания
        </div>


        <!-- ПУНКТ ПРОПУСКА -->

        <label for="checkpoint">
            📍 Пункт пропуска
        </label>

        <input
            type="text"
            id="checkpoint"
            placeholder="Введите пункт пропуска"
            autocomplete="off"
        >


        <!-- ФИО -->

        <label for="employee">
            👤 ФИО сотрудника
        </label>

        <input
            type="text"
            id="employee"
            placeholder="Введите ФИО сотрудника"
            autocomplete="off"
        >


        <!-- ОЦЕНКА -->

        <label>
            ⭐ Оценка работы
        </label>

        <div class="stars">

            <input
                type="radio"
                name="rating"
                id="star5"
                value="5"
            >

            <label for="star5">★</label>


            <input
                type="radio"
                name="rating"
                id="star4"
                value="4"
            >

            <label for="star4">★</label>


            <input
                type="radio"
                name="rating"
                id="star3"
                value="3"
            >

            <label for="star3">★</label>


            <input
                type="radio"
                name="rating"
                id="star2"
                value="2"
            >

            <label for="star2">★</label>


            <input
                type="radio"
                name="rating"
                id="star1"
                value="1"
            >

            <label for="star1">★</label>

        </div>


        <!-- КОММЕНТАРИЙ -->

        <label for="comment">
            💬 Комментарий
        </label>

        <textarea
            id="comment"
            placeholder="Напишите отзыв или замечание..."
        ></textarea>


        <!-- ОШИБКА -->

        <div
            class="error"
            id="errorBlock"
        ></div>


        <!-- КНОПКА -->

        <button
            id="sendButton"
            onclick="sendRating()"
        >
            Отправить оценку
        </button>


        <div class="footer">
            Ваш отзыв помогает улучшать качество обслуживания
        </div>

    </div>


    <!-- =========================
         УСПЕШНАЯ ОТПРАВКА
    ========================== -->

    <div
        class="success"
        id="successBlock"
    >

        <div class="success-icon">
            ✅
        </div>

        <h2>
            Спасибо за оценку!
        </h2>

        <p>
            Ваша оценка успешно отправлена.
        </p>

        <p>
            Ваш отзыв зарегистрирован в системе.
        </p>

        <button onclick="location.reload()">
            Новая оценка
        </button>

    </div>

</div>


<script>

    // ==================================================
    // АДРЕС API
    // ==================================================
    //
    // ВАЖНО:
    // Не используем 127.0.0.1.
    //
    // Если HTML открыт с Render,
    // запрос автоматически идёт на Render.
    //

    const API_URL = "/api/rating";


    // ==================================================
    // ОТПРАВКА ОЦЕНКИ
    // ==================================================

    async function sendRating() {

        const checkpoint =
            document
                .getElementById("checkpoint")
                .value
                .trim();


        const employee =
            document
                .getElementById("employee")
                .value
                .trim();


        const comment =
            document
                .getElementById("comment")
                .value
                .trim();


        const ratingElement =
            document.querySelector(
                'input[name="rating"]:checked'
            );


        const errorBlock =
            document.getElementById(
                "errorBlock"
            );


        const sendButton =
            document.getElementById(
                "sendButton"
            );


        // Скрываем старую ошибку

        errorBlock.style.display = "none";


        // ==================================================
        // ПРОВЕРКА ПУНКТА ПРОПУСКА
        // ==================================================

        if (!checkpoint) {

            showError(
                "Введите пункт пропуска."
            );

            return;
        }


        // ==================================================
        // ПРОВЕРКА ФИО
        // ==================================================

        if (!employee) {

            showError(
                "Введите ФИО сотрудника."
            );

            return;
        }


        // ==================================================
        // ПРОВЕРКА ОЦЕНКИ
        // ==================================================

        if (!ratingElement) {

            showError(
                "Поставьте оценку от 1 до 5."
            );

            return;
        }


        const rating =
            Number(
                ratingElement.value
            );


        // ==================================================
        // ДАННЫЕ
        // ==================================================

        const data = {

            checkpoint: checkpoint,

            employee: employee,

            rating: rating,

            comment: comment

        };


        console.log(
            "Отправляем:",
            data
        );


        // ==================================================
        // БЛОКИРУЕМ КНОПКУ
        // ==================================================

        sendButton.disabled = true;

        sendButton.textContent =
            "Отправка...";


        try {

            // ==================================================
            // ОТПРАВКА НА FLASK
            // ==================================================

            const response =
                await fetch(
                    API_URL,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify(
                                data
                            )
                    }
                );


            // ==================================================
            // ПОЛУЧАЕМ ОТВЕТ
            // ==================================================

            const result =
                await response.json();


            console.log(
                "Ответ сервера:",
                result
            );


            // ==================================================
            // ПРОВЕРКА ОТВЕТА
            // ==================================================

            if (
                !response.ok ||
                !result.success
            ) {

                throw new Error(
                    result.message ||
                    "Сервер не принял оценку"
                );
            }


            // ==================================================
            // УСПЕШНО
            // ==================================================

            document
                .getElementById(
                    "formBlock"
                )
                .style.display = "none";


            document
                .getElementById(
                    "successBlock"
                )
                .style.display = "block";


        } catch (error) {

            console.error(
                "Ошибка:",
                error
            );


            showError(
                "❌ Не удалось отправить оценку.\n\n" +
                error.message
            );


            sendButton.disabled = false;

            sendButton.textContent =
                "Отправить оценку";
        }
    }


    // ==================================================
    // ПОКАЗ ОШИБКИ
    // ==================================================

    function showError(message) {

        const errorBlock =
            document.getElementById(
                "errorBlock"
            );


        errorBlock.textContent =
            message;


        errorBlock.style.display =
            "block";
    }

</script>

</body>
</html>
