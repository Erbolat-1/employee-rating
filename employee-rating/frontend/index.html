```html
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Оценка сотрудника</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;

            background: linear-gradient(
                135deg,
                #03152d,
                #0865c5
            );

            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 520px;

            background: white;
            border-radius: 24px;
            padding: 30px;

            box-shadow:
                0 20px 60px rgba(0, 0, 0, .35);
        }

        .logo {
            width: 75px;
            height: 75px;

            margin: 0 auto 15px;

            border-radius: 50%;

            background: #0865c5;
            color: white;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 35px;
        }

        h1 {
            text-align: center;
            color: #073b75;
            margin: 0;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin: 8px 0 25px;
        }

        label {
            display: block;

            font-weight: bold;

            margin-top: 18px;
            margin-bottom: 7px;

            color: #333;
        }

        input,
        textarea {
            width: 100%;

            padding: 14px;

            border: 1px solid #ccc;
            border-radius: 12px;

            font-size: 16px;

            outline: none;
        }

        input:focus,
        textarea:focus {
            border-color: #0865c5;
        }

        textarea {
            min-height: 110px;
            resize: vertical;
        }

        /* ЗВЁЗДЫ */

        .stars {
            display: flex;
            flex-direction: row-reverse;

            justify-content: center;

            gap: 5px;

            margin: 10px 0 20px;
        }

        .stars input {
            display: none;
        }

        .stars label {
            margin: 0;

            font-size: 45px;

            color: #ccc;

            cursor: pointer;
        }

        .stars label:hover,
        .stars label:hover ~ label,
        .stars input:checked ~ label {
            color: #ffc107;
        }

        /* КНОПКА */

        button {
            width: 100%;

            border: none;
            border-radius: 12px;

            background: #0865c5;
            color: white;

            padding: 16px;

            margin-top: 20px;

            font-size: 17px;
            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #064d98;
        }

        button:disabled {
            background: #999;
            cursor: not-allowed;
        }

        /* УСПЕШНАЯ ОТПРАВКА */

        .success {
            display: none;

            text-align: center;

            padding: 20px;
        }

        .success-icon {
            font-size: 65px;
        }

        .success h2 {
            color: #16833b;
        }

        .footer {
            text-align: center;

            color: #999;

            font-size: 12px;

            margin-top: 18px;
        }
    </style>
</head>

<body>

<div class="card">

    <!-- ФОРМА -->

    <div id="formBlock">

        <div class="logo">
            ★
        </div>

        <h1>
            Оценка сотрудника
        </h1>

        <div class="subtitle">
            Оцените качество обслуживания
        </div>


        <!-- ПУНКТ ПРОПУСКА -->

        <label for="checkpoint">
            📍 Пункт пропуска
        </label>

        <input
            type="text"
            id="checkpoint"
            placeholder="Введите пункт пропуска"
            maxlength="100"
        >


        <!-- ФИО -->

        <label for="employee">
            👤 ФИО сотрудника
        </label>

        <input
            type="text"
            id="employee"
            placeholder="Введите ФИО сотрудника"
            maxlength="150"
        >


        <!-- ОЦЕНКА -->

        <label>
            ⭐ Оценка работы
        </label>

        <div class="stars">

            <input
                type="radio"
                name="rating"
                id="star5"
                value="5"
            >

            <label for="star5">★</label>


            <input
                type="radio"
                name="rating"
                id="star4"
                value="4"
            >

            <label for="star4">★</label>


            <input
                type="radio"
                name="rating"
                id="star3"
                value="3"
            >

            <label for="star3">★</label>


            <input
                type="radio"
                name="rating"
                id="star2"
                value="2"
            >

            <label for="star2">★</label>


            <input
                type="radio"
                name="rating"
                id="star1"
                value="1"
            >

            <label for="star1">★</label>

        </div>


        <!-- КОММЕНТАРИЙ -->

        <label for="comment">
            💬 Комментарий
        </label>

        <textarea
            id="comment"
            placeholder="Напишите отзыв или замечание..."
            maxlength="1000"
        ></textarea>


        <!-- КНОПКА -->

        <button
            id="sendButton"
            onclick="sendRating()"
        >
            Отправить оценку
        </button>


        <div class="footer">
            Ваш отзыв помогает улучшать качество обслуживания
        </div>

    </div>


    <!-- УСПЕШНАЯ ОТПРАВКА -->

    <div
        class="success"
        id="successBlock"
    >

        <div class="success-icon">
            ✅
        </div>

        <h2>
            Спасибо за оценку!
        </h2>

        <p>
            Ваша оценка успешно отправлена.
        </p>

        <button onclick="location.reload()">
            Новая оценка
        </button>

    </div>

</div>


<script>

async function sendRating() {

    const checkpoint =
        document
            .getElementById("checkpoint")
            .value
            .trim();


    const employee =
        document
            .getElementById("employee")
            .value
            .trim();


    const comment =
        document
            .getElementById("comment")
            .value
            .trim();


    const ratingElement =
        document.querySelector(
            'input[name="rating"]:checked'
        );


    /* Проверка пункта пропуска */

    if (!checkpoint) {

        alert(
            "Введите пункт пропуска."
        );

        return;
    }


    /* Проверка ФИО */

    if (!employee) {

        alert(
            "Введите ФИО сотрудника."
        );

        return;
    }


    /* Проверка оценки */

    if (!ratingElement) {

        alert(
            "Поставьте оценку от 1 до 5."
        );

        return;
    }


    const rating =
        Number(ratingElement.value);


    /* Данные */

    const data = {

        checkpoint: checkpoint,

        employee: employee,

        rating: rating,

        comment: comment

    };


    const sendButton =
        document.getElementById(
            "sendButton"
        );


    try {

        /* Блокируем кнопку */

        sendButton.disabled = true;

        sendButton.textContent =
            "Отправка...";


        /* Отправляем данные Python */

        const response =
            await fetch(
                "https://employee-rating-1.onrender.com/api/rating",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify(data)
                }
            );


        const result =
            await response.json();


        if (
            !response.ok ||
            !result.success
        ) {

            throw new Error(
                "Сервер не принял оценку"
            );

        }


        console.log(
            "Оценка отправлена:",
            result
        );


        /* Показываем успех */

        document
            .getElementById(
                "formBlock"
            )
            .style.display = "none";


        document
            .getElementById(
                "successBlock"
            )
            .style.display = "block";


    } catch (error) {

        console.error(
            "Ошибка:",
            error
        );


        alert(
            "❌ Не удалось отправить оценку.\n\n" +
            "Убедитесь, что Python-сервер запущен."
        );


        sendButton.disabled = false;

        sendButton.textContent =
            "Отправить оценку";
    }

}

</script>

</body>
</html>
